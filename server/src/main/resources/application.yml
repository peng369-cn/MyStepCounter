server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/step_counter?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf-8
    username: root
    password: ${MYSQL_PASSWORD:77256}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 10000
      initialization-fail-timeout: -1
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:77256}
      database: 0
      timeout: 3000ms

logging:
  level:
    com.zaxxer.hikari: DEBUG
    org.springframework.data.redis: DEBUG
    org.springframework.boot.autoconfigure: INFO

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: your-jwt-secret-key-change-in-production-min-256-bits-long-enough
    secret-old:
    global-version: 0
    access-expiration-ms: 900000
    refresh-expiration-ms: 2592000000
